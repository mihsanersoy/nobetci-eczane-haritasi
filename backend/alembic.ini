# A generic, single database configuration for async SQLAlchemy.

[alembic]
# Migration dosyalarının bulunduğu klasör yolu
script_location = alembic

# Migration dosya adı şablonu (Yıl_Ay_Gün_SaatDakika-Revizyon_Açıklama)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path'e mevcut çalışma dizinini (/app) ekler, böylece 'app.*' modülleri sorunsuz import edilir
prepend_sys_path = .

# Zaman dilimi (UTC)
timezone = UTC

# Maksimum slug karakter uzunluğu
truncate_slug_length = 40

# Veritabanı URL'si env.py içinde dinamik olarak app.core.config.settings.DATABASE_URL'den alınır
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Üretilen migration dosyalarını formatlamak isterseniz (opsiyonel)


# Logging (Loglama) Konfigürasyonu
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
